; ============================================================
; PHP Session Configuration Override for XAMPP
; ============================================================
;
; This file is read by PHP-CGI and PHP-FPM BEFORE any PHP script
; executes. It overrides the global php.ini settings for this
; directory and all subdirectories.
;
; On XAMPP, the .htaccess php_value directives only work with
; mod_php (Apache module). But XAMPP often uses PHP-CGI or
; PHP-FPM, where .htaccess php_value is silently IGNORED.
;
; The .user.ini file works with ALL PHP SAPI modes (CGI, FPM,
; and mod_php). It is the ONLY reliable way to override PHP
; settings on XAMPP regardless of how PHP is loaded.
;
; Key settings explained:
;
; session.gc_maxlifetime = 28800
;   How long session files live before garbage collection (8 hours)
;   XAMPP default is often 300 (5 min!) or 1440 (24 min)
;
; session.gc_probability = 0
;   Disable PHP's native garbage collector entirely.
;   Laravel handles its own session cleanup via the lottery
;   mechanism, which respects session.lifetime (480 min = 8h).
;   Setting this to 0 means PHP will NEVER delete session files,
;   regardless of gc_maxlifetime. Only Laravel's cleanup runs.
;
; session.cookie_lifetime = 28800
;   How long the session cookie lives in the browser (8 hours)
;   Default is 0 = until browser closes. Setting to 28800 ensures
;   the cookie persists even if the browser is minimized.
;
; session.save_path = writable path
;   Explicitly set where session files are stored, so PHP's GC
;   doesn't accidentally scan/delete files from other apps.
;
; ============================================================

session.gc_maxlifetime = 28800
session.gc_probability = 0
session.gc_divisor = 1
session.cookie_lifetime = 28800
session.use_strict_mode = 0
session.save_path = "/tmp"

; Also increase max execution time for long mark entry sessions
max_execution_time = 300
