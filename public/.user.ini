; Safety net — primary fix is the database session driver.
; File sessions get killed by PHP's native GC on XAMPP.
; The database driver bypasses PHP file sessions entirely.
; Session lifetime is now 24 hours (86400 seconds).
session.gc_maxlifetime = 86400
session.gc_probability = 0
session.gc_divisor = 1
session.cookie_lifetime = 86400
; SECURITY: strict mode rejects uninitialized session IDs, mitigating
; session fixation. Was previously 0.
session.use_strict_mode = 1
max_execution_time = 300
; File upload limits — must be large enough for high-res phone photos.
; Phone cameras can produce 10-20MB JPEGs. The ImageCompressor will
; compress them down to ~2MB AFTER upload, but PHP must accept the
; large file first.
upload_max_filesize = 60M
post_max_size = 65M
memory_limit = 256M
