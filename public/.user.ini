; ============================================================
; PHP Session Configuration Override for XAMPP
; ============================================================
;
; This file is read by PHP-CGI and PHP-FPM BEFORE any PHP script
; executes. It overrides the global php.ini settings for this
; directory and all subdirectories.
;
; On XAMPP, the .htaccess php_value directives only work with
; mod_php (Apache module). But XAMPP often uses PHP-CGI or
; PHP-FPM, where .htaccess php_value is silently IGNORED.
;
; The .user.ini file works with ALL PHP SAPI modes (CGI, FPM,
; and mod_php). It is the ONLY reliable way to override PHP
; settings on XAMPP regardless of how PHP is loaded.
;
; NOTE: We do NOT set session.save_path here because:
; - On Windows XAMPP, it's C:\xampp\tmp
; - On Linux, it's /tmp or /var/lib/php/sessions
; - Wrong path would BREAK sessions entirely
; - PHP's default is correct for each platform
;
; The real fix is NoGarbageSessionHandler in app/Session/
; which makes gc() a no-op. This .user.ini is just extra safety.
;
; ============================================================

session.gc_maxlifetime = 28800
session.gc_probability = 0
session.gc_divisor = 1
session.cookie_lifetime = 28800
session.use_strict_mode = 0

; Increase max execution time for long mark entry sessions
max_execution_time = 300
