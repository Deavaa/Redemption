; Safety net — primary fix is the database session driver.
; File sessions get killed by PHP's native GC on XAMPP.
; The database driver bypasses PHP file sessions entirely.
session.gc_maxlifetime = 28800
session.gc_probability = 0
session.gc_divisor = 1
session.cookie_lifetime = 28800
session.use_strict_mode = 0
max_execution_time = 300
