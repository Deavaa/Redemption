; PHP Configuration — cPanel fallback
; Some cPanel hosts read php.ini instead of .user.ini
; This file is a mirror of the .user.ini settings
upload_max_filesize = 60M
post_max_size = 65M
memory_limit = 256M
max_execution_time = 300
max_input_time = 120
session.gc_maxlifetime = 86400
session.gc_probability = 0
session.gc_divisor = 1
session.cookie_lifetime = 86400
session.use_strict_mode = 1
