<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>School of Redemption</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #047857 0%, #0d9488 50%, #06b6d4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .loader { text-align: center; }
        .logo {
            width: 100px; height: 100px;
            background: rgba(255,255,255,0.15);
            border-radius: 24px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 24px; font-size: 48px;
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 14px; opacity: 0.8; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(255,255,255,0.2);
            border-top-color: #fff; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 24px auto 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo">🎓</div>
        <h1>School of Redemption</h1>
        <p>Loading...</p>
        <div class="spinner"></div>
    </div>
    <script>window.location.href = 'https://schoolofredemption.net';</script>
</body>
</html>
